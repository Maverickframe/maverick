name: Deploy theme to PRODUCTION (manual only)

# НИКОГДА не запускается автоматически. Только вручную:
# GitHub -> Actions -> "Deploy theme to PRODUCTION (manual only)" -> Run workflow
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build assets & deploy to PROD via FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build assets via Vite
        env:
          VITE_ENTRY_POINT: /src/js/bundle.js
          VITE_STYLES: /src/scss/main.scss
          VITE_STYLES_NEW: /src/scss/new.scss
          VITE_STYLES_BLOCKS: /src/scss/blocks.scss
        run: npm run build

      - name: Deploy theme to PRODUCTION
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PROD_FTP_HOST }}
          username: ${{ secrets.PROD_FTP_USER }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          server-dir: /wp-content/themes/maverickframe/
          protocol: ftps
          port: 21
          state-name: .ftp-deploy-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/.env*
            .ftp-deploy-state.json
            .github/**
            CLAUDE.md
            README.md

      # T46 (2026-07-08): a theme deploy changes rendered HTML WITHOUT firing any
      # WP save-hook, so WP Rocket's ORIGIN file cache is never invalidated and a
      # bare Rocket.net purge only clears the Cloudflare edge (which then re-caches
      # the stale origin file for up to 30 days). Fix = two-layer flush, origin FIRST
      # then edge. See Marketing Claude/reports-inbox.md T46 + rocket-purge.py.
      - name: Purge cache (WP Rocket origin + Cloudflare edge)
        if: success()
        continue-on-error: true
        env:
          ROCKET_USER: ${{ secrets.ROCKET_USER }}
          ROCKET_PASS: ${{ secrets.ROCKET_PASS }}
        run: |
          SITE=271260
          ORIGIN='/home/e2i1ixd/public_html/wp-content/cache/wp-rocket/maverickframe.com'
          if [ -z "$ROCKET_USER" ] || [ -z "$ROCKET_PASS" ]; then
            echo "::warning title=Cache::ROCKET_USER/ROCKET_PASS secrets not set — skipping auto-purge. Run rocket-purge.py --all manually."; exit 0; fi
          JWT=$(curl -s https://api.rocket.net/v1/login -H "Content-Type: application/json" \
            -d "{\"username\":\"$ROCKET_USER\",\"password\":\"$ROCKET_PASS\"}" \
            | jq -r '.token // .data.token // .jwt // .access_token // empty')
          if [ -z "$JWT" ]; then
            echo "::warning title=Cache::Rocket.net login failed — skipping auto-purge. Run rocket-purge.py --all manually."; exit 0; fi
          echo "1/2 delete WP Rocket origin cache tree ($ORIGIN)"
          curl -s -X DELETE "https://api.rocket.net/v1/sites/$SITE/files" \
            -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" \
            -d "{\"file\":\"$ORIGIN\"}"; echo
          echo "2/2 purge Cloudflare edge (purge_everything)"
          curl -s -X POST "https://api.rocket.net/v1/sites/$SITE/cache/purge_everything" \
            -H "Authorization: Bearer $JWT"; echo
          echo "::notice title=Cache::Two-layer flush done — verify canonical anonymously (no query string)."

      - name: Summary
        if: success()
        run: |
          echo "::notice title=Deployed::Theme deployed to PRODUCTION - https://maverickframe.com/"
